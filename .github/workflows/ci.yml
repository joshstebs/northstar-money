name: Validate
on:
  pull_request:
  push:
    branches: [master]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/northstar
      - run: npm run typecheck
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/northstar
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/northstar
          APP_URL: http://localhost:3000
          APP_AUTH_SECRET: ci-only-not-a-production-secret
          APP_AUTH_PASSWORD_HASH: pbkdf2-sha512$210000$Y2ktc2FsdA$7FNbf8x6_xp6pB_TjMOuZGDj8J8R79EOn-FakeHashForBuildOnly
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
